name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      skip-frontend:
        description: Release runs the same frontend workflow separately for early packaging.
        type: boolean
        default: false
      skip-container:
        description: Release verifies its final native images, including the manager smoke.
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  source:
    name: Source and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            norma/go.sum
      - run: python3 ci/verify-source.py
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: bash -n build.sh install.sh update.sh start.sh deploy/container-tools/npx.sh ci/managed-runner-smoke.sh
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  static:
    name: Go modules and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: |
          go mod verify
          go vet ./...
          cd norma
          go mod verify
          go vet ./...

  toolkit:
    name: Python environment and toolkit (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: docker build --target python-runtime -t artex:python-test .
      - name: Offline, non-root Python operations and toolkit regression
        run: |
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges --memory 2g \
            --tmpfs /tmp:rw,mode=1777 -e HOME=/tmp/home -e PYTHONPATH=/src/toolkit \
            -v "$PWD:/src:ro" artex:python-test python3 /src/ci/python-environment-smoke.py
          docker run --rm --network none --read-only --user 10001:10001 \
            --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,mode=1777 \
            -e HOME=/tmp -e PYTHONPATH=/src/toolkit -v "$PWD:/src:ro" \
            artex:python-test python3 -m unittest discover -s /src/toolkit/tests -v

  backend:
    name: Go and PostgreSQL regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: artex_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: artex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U artex_test -d artex_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ARTEX_TEST_PG_DSN: postgres://artex_test:ci-only-password@127.0.0.1:5432/artex_test?sslmode=disable
      ARTEX_TRAFFIC_TEST_DSN: postgres://artex_test:ci-only-password@127.0.0.1:5432/artex_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            norma/go.sum
      - name: Two full integration runs
        run: go test ./... -count=2 -timeout=10m
      - name: Scheduling, cancellation, failover and shutdown races
        run: go test -race ./agent ./server ./db ./runner ./runnernode ./runnerfiles ./resourcelib ./skills ./toolenv ./llmpool ./traffic ./enrich -count=1 -timeout=10m
      - name: Runner isolation and file transfer in real Docker containers
        env:
          ARTEX_RUNNER_DOCKER_IMAGE: python@sha256:423ed6ab25b1921a477529254bfeeabf5855151dc2c3141699a1bfc852199fbf
          ARTEX_RUNNER_BINARY: /tmp/artex-runner-integration
        run: |
          CGO_ENABLED=0 go build -o "$ARTEX_RUNNER_BINARY" ./cmd/artex-runner
          docker pull "$ARTEX_RUNNER_DOCKER_IMAGE"
          go test -race ./integration -count=2 -timeout=5m

  sdk:
    name: Norma SDK regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: norma/go.mod
          cache-dependency-path: norma/go.sum
      - name: Local Norma SDK regression
        working-directory: norma
        run: |
          go test ./... -count=1 -timeout=10m
          go test -race ./agentcore ./harness ./tool ./mcp ./llm -count=1 -timeout=10m
          go test -race ./noaadapter -run 'Test(Reassemble|CompressReplay|Concurrent|SessionConcurrent|StateStoreConcurrent|ArchiverConcurrent|ChaosAgent|LongSessionViewStaysValid)' -count=1 -timeout=5m

  frontend:
    if: ${{ !inputs.skip-frontend }}
    uses: ./.github/workflows/frontend.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  container:
    name: Container API and offline browser smoke
    needs: portable
    if: ${{ !inputs.skip-container }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-tools
          path: deploy/container-tools/portable-cache
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: artex:ci
          build-args: |
            ARTEX_BUILD_VERSION=ci
            PORTABLE_TOOLS_SOURCE=portable-tools-prebuilt
            VCS_REF=${{ inputs.ref || github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            NPM_REGISTRY=https://registry.npmjs.org
            PLAYWRIGHT_DOWNLOAD_HOST=
          cache-from: |
            type=gha,scope=artex-linux-amd64-ci
            type=gha,scope=artex-linux-amd64-release
            type=gha,scope=artex-linux-amd64
          cache-to: type=gha,mode=max,scope=artex-linux-amd64-ci
      - run: python3 ci/image-smoke.py artex:ci ci
      - name: Runner executable included in the runtime image
        run: docker run --rm --entrypoint /usr/local/bin/artex-runner artex:ci -h
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            norma/go.sum
      - name: Containerized manager and clean execution environments
        run: bash ci/managed-runner-smoke.sh artex:ci

  portable:
    if: ${{ !inputs.skip-container }}
    uses: ./.github/workflows/portable-tools.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
