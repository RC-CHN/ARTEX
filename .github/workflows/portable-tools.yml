name: Portable tools
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      hit: ${{ steps.restore.outputs.cache-hit }}
      key: ${{ steps.restore.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: restore
        with:
          path: dist/portable-tools
          key: portable-v1-${{ hashFiles('toolkit/portable-build.lock.json', 'deploy/build-portable-tools.py', 'deploy/portable_bundle.py') }}
      - if: steps.restore.outputs.cache-hit == 'true'
        run: python3 deploy/portable_bundle.py validate dist/portable-tools
      - if: steps.restore.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-tools
          path: dist/portable-tools/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  build:
    needs: cache
    if: needs.cache.outputs.hit != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.3
          cache: false
      - name: Compile independent platform shard
        env:
          PORTABLE_SHARD: ${{ matrix.shard }}
        run: |
          python3 deploy/build-portable-tools.py --shards 4 --shard-index "$PORTABLE_SHARD" \
            --jobs 2 --output dist/portable-shard
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-shard-${{ matrix.shard }}
          path: dist/portable-shard/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: [cache, build]
    if: ${{ !cancelled() && needs.cache.result == 'success' && needs.cache.outputs.hit != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: portable-shard-*
          path: dist/shards
      - run: python3 deploy/portable_bundle.py merge dist/portable-tools dist/shards/portable-shard-*
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/portable-tools
          key: ${{ needs.cache.outputs.key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-tools
          path: dist/portable-tools/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 7
