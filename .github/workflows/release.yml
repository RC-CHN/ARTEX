name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main, for example v0.4.0
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      image: ${{ steps.release.outputs.image }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 ci/release-metadata.py

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}
      skip-frontend: true
      skip-container: true

  frontend:
    needs: metadata
    uses: ./.github/workflows/frontend.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}

  binaries:
    needs: [metadata, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            norma/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ needs.metadata.outputs.version }}
          ARTEX_SKIP_FRONTEND: '1'
          ARTEX_SKIP_NPM_CI: '1'
          ARTEX_COMPRESS: '0'
          ARTEX_PACKAGE: '1'
        run: ./build.sh --target "$ARTEX_TARGET_OS/$ARTEX_TARGET_ARCH"
      - if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          overwrite: true
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  containers:
    needs: [metadata, portable]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable-tools
          path: deploy/container-tools/portable-cache
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: artex:release
          build-args: |
            ARTEX_BUILD_VERSION=${{ needs.metadata.outputs.version }}
            PORTABLE_TOOLS_SOURCE=portable-tools-prebuilt
            VCS_REF=${{ needs.metadata.outputs.commit }}
            GOPROXY=https://proxy.golang.org,direct
            NPM_REGISTRY=https://registry.npmjs.org
            PLAYWRIGHT_DOWNLOAD_HOST=
          cache-from: |
            type=gha,scope=artex-linux-${{ matrix.arch }}-release
            type=gha,scope=artex-linux-${{ matrix.arch }}-ci
            type=gha,scope=artex-linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=artex-linux-${{ matrix.arch }}-release
      - name: Native architecture smoke before publishing
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 ci/image-smoke.py artex:release "$VERSION"
      - if: matrix.arch == 'amd64'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            norma/go.sum
      - name: Containerized manager and clean execution environments
        if: matrix.arch == 'amd64'
        run: bash ci/managed-runner-smoke.sh artex:release
      - name: Offline export pagination and search in a real browser
        if: matrix.arch == 'amd64'
        run: |
          ARTEX_DOGFOOD_OUTPUT="$RUNNER_TEMP/artex-offline-viewer" go test ./recordexport -run '^TestOfflineViewerShardsKeepEveryRecord$' -count=1
          docker run --rm --network none --entrypoint node \
            -v "$PWD/ci/offline-viewer-smoke.cjs:/test.cjs:ro" \
            -v "$RUNNER_TEMP/artex-offline-viewer:/artifacts:ro" artex:release /test.cjs

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage verified architecture by digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.metadata.outputs.image }}
          TAG: ${{ needs.metadata.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          # A specific-job rerun can reuse metadata from before publication.
          python3 ci/release_guard.py "$TAG"
          candidate="$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker tag artex:release "$candidate"
          for attempt in 1 2 3; do
            if docker push "$candidate"; then break; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep "$((attempt * 5))"
          done
          python3 ci/release_images.py record "$candidate" verified-images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.arch }}
          overwrite: true
          path: verified-images/*.json
          if-no-files-found: error
          retention-days: 7

  portable:
    needs: metadata
    uses: ./.github/workflows/portable-tools.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}

  publish:
    # Every test suite and both exact release images must pass before a version
    # tag or public GitHub release can change. Candidate images are never latest.
    needs: [metadata, checks, frontend, binaries, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.metadata.outputs.tag }}
      VERSION: ${{ needs.metadata.outputs.version }}
      IMAGE: ${{ needs.metadata.outputs.image }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
      COMMIT: ${{ needs.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*
          merge-multiple: true
          path: verified-images
      - name: Verify package set and generate checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 5
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            test -s "artex-$VERSION-$platform.zip"
          done
          sha256sum -- *.zip > SHA256SUMS
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an already published version before changing manifests
        run: python3 ci/release_guard.py "$TAG"
      - name: Assemble verified multi-architecture version
        run: python3 ci/release_images.py publish verified-images
      - name: Publish complete release
        run: |
          python3 ci/release_guard.py "$TAG"
          if gh release view "$TAG" --json isDraft > /tmp/release.json 2>/dev/null; then
            jq -e '.isDraft == true' /tmp/release.json >/dev/null || {
              echo 'Published versions are immutable; use a new version tag.' >&2
              exit 1
            }
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest=false
          fi
      - name: Release summary
        run: |
          {
            echo "Published $TAG: five platform archives, SHA256SUMS, and $IMAGE:$TAG."
            echo 'Both image architectures passed API and offline browser smoke tests.'
            echo 'Cluster upgrades use a separately verified digest; this workflow has no cluster credentials.'
            echo 'On the first GHCR publication, set the package visibility to public for anonymous installation.'
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [metadata, publish]
    if: needs.metadata.outputs.prerelease == 'false'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/promote.yml
    with:
      tag: ${{ needs.metadata.outputs.tag }}
