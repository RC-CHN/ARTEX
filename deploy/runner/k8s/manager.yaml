apiVersion: v1
kind: ConfigMap
metadata:
  name: artex-runner-config
data:
  runner.json: |
    {
      "server_url": "https://artex.example.org",
      "name": "kubernetes-pool",
      "executor": "kubernetes",
      "data_dir": "/var/lib/artex-runner/identity",
      "workspace_dir": "/var/lib/artex-workspace/sessions",
      "capabilities": {
        "slots": 4,
        "cpu_millis": 4000,
        "memory_mib": 8192,
        "environments": ["default"],
        "labels": {"network": "cluster"}
      },
      "kubernetes": {
        "namespace": "artex-runners",
        "workspace_pvc": "artex-runner-workspace",
        "workspace_sub_path": "sessions",
        "service_account": "artex-sandbox",
        "image_pull_secrets": ["registry-pull"]
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artex-runner-manager
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: artex-runner-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artex-runner-manager
    spec:
      serviceAccountName: artex-runner-manager
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: ghcr.io/rc-chn/artex:latest
          command: [/usr/local/bin/artex-runner]
          args: [-config, /etc/artex-runner/runner.json, -token-file, /run/enrollment/token]
          env:
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/artex-runner
              readOnly: true
            - name: enrollment
              mountPath: /run/enrollment
              readOnly: true
            - name: identity
              mountPath: /var/lib/artex-runner
            - name: workspace
              mountPath: /var/lib/artex-workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: artex-runner-config
        - name: enrollment
          secret:
            secretName: artex-runner-enrollment
            optional: true
            defaultMode: 0440
        - name: identity
          persistentVolumeClaim:
            claimName: artex-runner-identity
        - name: workspace
          persistentVolumeClaim:
            claimName: artex-runner-workspace
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
