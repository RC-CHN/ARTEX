apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artex-runner-identity
spec:
  accessModes: [ReadWriteMany]
  storageClassName: shared-storage
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artex-runner-workspace
spec:
  accessModes: [ReadWriteMany]
  storageClassName: shared-storage
  resources:
    requests:
      storage: 20Gi
